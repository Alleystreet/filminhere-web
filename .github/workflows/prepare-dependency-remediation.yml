name: Prepare Dependency Remediation

on:
  push:
    branches:
      - security/dependency-remediation

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://jryjcvcnbrqtgamxpxas.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_rXhfIlSYyhUyO8P_6qutqA_xL7v-9SL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Upgrade framework dependencies
        run: npm install next@16.3.8 eslint-config-next@16.3.8 --save-exact
      - name: Verify
        run: |
          npm run lint
          npm run build
      - name: Audit after upgrade
        shell: bash
        run: |
          npm audit --json > audit-after.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('audit-after.json','utf8'));
          console.log('AUDIT_AFTER_METADATA', JSON.stringify(a.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
            console.log('AUDIT_AFTER_VULN', JSON.stringify({
              name,
              severity:v.severity,
              isDirect:v.isDirect,
              range:v.range,
              fixAvailable:v.fixAvailable
            }));
          }
          NODE
      - name: Commit lockfile update
        shell: bash
        run: |
          git config user.name "Alleystreet CI"
          git config user.email "ci@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js security patches [skip ci]"
          git push origin HEAD:security/dependency-remediation
