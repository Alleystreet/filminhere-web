name: Runtime Dependency Audit

on:
  push:
    branches:
      - security/dependency-remediation

jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > runtime-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('runtime-audit.json','utf8'));
          console.log('RUNTIME_AUDIT_METADATA', JSON.stringify(a.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
            console.log('RUNTIME_AUDIT_VULN', JSON.stringify({
              name,
              severity:v.severity,
              isDirect:v.isDirect,
              range:v.range,
              fixAvailable:v.fixAvailable
            }));
          }
          NODE
