name: Booking Role Separation

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Current Vercel Preview URL to test"
        required: true
        type: string

permissions:
  contents: read

jobs:
  role-separation:
    name: Verify filmmaker and host are separate identities
    runs-on: ubuntu-latest
    environment: preview-test
    env:
      TEST_BASE_URL: ${{ inputs.base_url }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
      TEST_SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify booking role separation
        run: node scripts/test-booking-role-separation.mjs
