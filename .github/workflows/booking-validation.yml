name: Booking Validation

on:
  pull_request:
    paths:
      - "app/api/booking/create/**"
      - "scripts/test-booking-validation.mjs"
      - "scripts/test-booking-route.mjs"
      - "package.json"
      - ".github/workflows/booking-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  booking-validation:
    name: Booking date and request regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run booking validation tests
        run: npm run test:booking-validation

      - name: Run isolated booking handler tests
        run: npm run test:booking-route
