name: NPM Audit Details

on:
  push:
    branches:
      - verify/npm-audit-details

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture npm audit
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('audit.json','utf8'));
          console.log('AUDIT_METADATA', JSON.stringify(a.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
            const via = Array.isArray(v.via)
              ? v.via.map(x => typeof x === 'string' ? x : ({source:x.source,name:x.name,title:x.title,severity:x.severity,range:x.range,url:x.url}))
              : v.via;
            console.log('AUDIT_VULN', JSON.stringify({
              name,
              severity:v.severity,
              isDirect:v.isDirect,
              range:v.range,
              nodes:v.nodes,
              via,
              effects:v.effects,
              fixAvailable:v.fixAvailable
            }));
          }
          NODE
